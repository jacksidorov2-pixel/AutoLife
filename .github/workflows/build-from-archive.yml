name: Build AutoLife APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat source.b64.part00 source.b64.part01 source.b64.part02 source.b64.part03 source.b64.part04 > source.b64
          base64 -d source.b64 > AutoLife-0.1-source.zip
          unzip -q AutoLife-0.1-source.zip
          test -f AutoLife/settings.gradle
          test -f AutoLife/app/build.gradle

      - name: Apply AutoLife v0.2 base overrides
        shell: bash
        run: |
          gzip -dc overrides/MainActivity.java.gz > AutoLife/app/src/main/java/com/autolife/MainActivity.java
          gzip -dc overrides/UsbCarLifeTransport.java.gz > AutoLife/app/src/main/java/com/autolife/core/UsbCarLifeTransport.java
          gzip -dc overrides/app-build.gradle.gz > AutoLife/app/build.gradle
          grep -q "versionName '0.2.0'" AutoLife/app/build.gradle

      - name: Apply AutoLife v0.3 handshake delta
        shell: bash
        run: |
          gzip -dc overrides/v0.3.patch.gz | (cd AutoLife && git apply --whitespace=nowarn -)
          grep -q "versionName '0.3.0'" AutoLife/app/build.gradle
          grep -q "PHASE 2 HU_STATISTIC_INFO" AutoLife/app/src/main/java/com/autolife/core/UsbCarLifeTransport.java
          grep -Fq "getString(byte[] data" AutoLife/app/src/main/java/com/autolife/core/ProtoLite.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: gradle -p AutoLife :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s AutoLife/app/build/outputs/apk/debug/app-debug.apk
          unzip -t AutoLife/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          ls -lh AutoLife/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLife-v0.3-debug-apk
          path: AutoLife/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
