name: Build AutoLife APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source.b64.part*'
      - '.github/workflows/build-from-archive.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat source.b64.part00 source.b64.part01 source.b64.part02 source.b64.part03 source.b64.part04 > source.b64
          base64 -d source.b64 > AutoLife-0.1-source.zip
          unzip -q AutoLife-0.1-source.zip
          test -f AutoLife/settings.gradle
          test -f AutoLife/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: gradle -p AutoLife :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s AutoLife/app/build/outputs/apk/debug/app-debug.apk
          ls -lh AutoLife/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLife-debug-apk
          path: AutoLife/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
